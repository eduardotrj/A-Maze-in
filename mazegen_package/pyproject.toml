[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation and solving package"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

authors = [
    { name = "Etrujill" },
    { name = "Ecakiray" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]