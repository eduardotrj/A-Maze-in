[project]
name = "a-maze-ing"
version = "0.1.0"
description = "Visual Maze Generator in Python"
authors = [
    { name = "Etrujill", email = "etrujill@student.42heilbronn.de" },
    { name = "Ecakiray", email = "ecakiray@student.42heilbronn.de" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pynput (>=1.8.2,<2.0.0)",
    "opencv-python (>=4.13.0)",
	"mlx==2.2"
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
mlx = { path = "./mlx-2.2-py3-ubuntu-any.whl" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"